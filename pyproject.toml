[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-pentest-agent"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1,<2",
  "litellm>=1.60,<2",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "playwright>=1.45,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["src*"]
