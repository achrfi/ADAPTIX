[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-pentest-agent"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=1,<2",
  "litellm>=1.60,<2",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "playwright>=1.50,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["langgraph-cli[inmem]>=0.4,<1"]

[tool.setuptools.packages.find]
include = ["src*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "venv", "artifacts", "build", "dist"]

[project.scripts]
adaptix = "src.adaptix.ui_entry:main"
