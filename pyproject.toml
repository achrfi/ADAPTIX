[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-pentest-agent"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=1,<2",
  "litellm>=1.60,<2",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "playwright>=1.50,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["langgraph-cli[inmem]>=0.4,<1"]

[tool.setuptools.packages.find]
include = ["src*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "venv", "artifacts", "build", "dist"]
# Portable collection: the project root is prepended so src.adaptix and the
# tests package both import no matter which directory pytest is invoked from.
# The root conftest.py seeds the same path for a bare pytest run and for
# tooling that ignores ini options.
pythonpath = ["."]

[project.scripts]
adaptix = "src.adaptix.ui_entry:main"
