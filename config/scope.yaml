# ADAPTIX Iterasi 3.1 — kebijakan global (BUKAN daftar setiap target).
# Remote target membutuhkan grant bertanda tangan dari administrator lokal.
authorization_required: true
allow_loopback_without_grant: true
limits:
  rate_per_second: 2
  concurrent_requests: 2
  timeout_seconds: 45
  # All TCP ports. Also accepts e.g. '22,80,443,8000-9000'.
  nmap_ports: 'all'
  # Extra ports trusted for in-process web_discover/http_request probing.
  web_ports: '80,443,3000,8080,8000-8099'
  nmap_timeout_seconds: 900
  # Select HTTP template tags from observed products/technology. Unknown -> native -as.
  # 'default' restores full native selection; 'baseline' or local path lists also work.
  nuclei_templates: 'adaptive'
  nuclei_timeout_seconds: 7200
# Tidak dapat dimintakan sebagai target walaupun grant ditandatangani.
blocked_cidrs:
  - 0.0.0.0/8
  - 169.254.0.0/16
  - 224.0.0.0/4
  - 240.0.0.0/4
  - ::/128
  - fe80::/10
  - ff00::/8
