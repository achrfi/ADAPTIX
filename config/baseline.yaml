# Deterministic baseline reconnaissance: bounded, target-aware discovery
# completed before the first model-driven planning decision. The phase never
# sends a request outside the pinned scope, never changes state, and never
# invokes an LLM. These limits are separate from the adaptive run budget: the
# global tool-call budget still applies on top of max_tool_calls.
baseline_reconnaissance:
  enabled: true
  # Wall-clock cap for the whole phase (bounded by the remaining run budget).
  max_seconds: 120
  # Phase-local tool-call cap; the run's own tool_call_budget is never exceeded.
  # Sized for discovery plus the three deterministic class probes, which each hold a
  # reserved slot: at 8 the phase stopped at `phase_tool_call_limit` right after
  # web_discover and one document probe, so no class check ever ran.
  max_tool_calls: 16
  # Tool calls the adaptive planning loop may always spend: the baseline caps
  # itself below the run budget by this reserve so model-planned work has room.
  adaptive_tool_call_reserve: 4
  # Legacy host-inventory cap. Network scanning is retired; use explicit HTTP URLs.
  max_hosts: 4
  # Distinct HTTP origins explored with web/ API discovery.
  max_web_origins: 2
  # Documentation document fetches (robots.txt/sitemap/openapi style) per origin.
  api_document_probes: 2
  # Cap on stored route records; overflow is recorded as a limitation, not dropped silently.
  max_web_routes: 400
  # Only supported value: record unavailable tools as limitations, never fabricate scans.
  fallback_when_tool_missing: record_limitation

# Static content discovery (ffuf) — the only pass that finds paths the
# application never links to (admin panels, API prefixes, backups, upload dirs).
# It runs on each authorized origin during the baseline, counts as ONE tool call,
# and every match is stored as an observed route, never as a finding.
static_discovery:
  enabled: true
  # Operator-facing wordlist profile; each maps to one bundled file in
  # work/wordlists/discovery. Available: quick (default, ~585 curated names),
  # common (4.7k), raft-small-dirs (20k), api (269), backup (221).
  # A larger profile needs a larger max_seconds or the sweep is trimmed to what
  # the rate permits and the trim is recorded in the run's artifact.
  profile: quick
  # Hard wall-clock cap per sweep, clamped by the remaining run budget.
  max_seconds: 420
  # Sweeps per origin during the baseline (1 = the configured profile only).
  max_profiles: 1
